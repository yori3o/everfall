license = "MIT"

modLoader="javafml"
loaderVersion="[1,)"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "Yori3o"
description = "A client-side mod that adds configurable seasonal particles to GUI screens."

logoFile = "assets/template/icon.png"
displayURL = "https://github.com/yori3o/everfall"
#issueTrackerUrl = "..."

[[mixins]]
config = "everfall.mixins.json"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "yet_another_config_lib_v3"
type = "required"
versionRange = "[${yacl},)"
ordering = "NONE"
side = "CLIENT"